spring:
  application:
    name: siga-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siga_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

server:
  port: ${PORT:8080}

siga:
  jwt:
    secret: ${SIGA_JWT_SECRET:sigaSecretKeySuperSecureAndVeryLong32Chars!}
    expiration: ${SIGA_JWT_EXPIRATION:86400000}
    cookie-secure: ${SIGA_JWT_COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

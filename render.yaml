services:
  # Web Service Unificado (Frontend Vite + Backend Spring Boot en un solo contenedor)
  - type: web
    name: siga-veterinaria
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      # Conexión a Base de Datos Permanente (Neon.tech / PostgreSQL Perpetuo Gratuito)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SIGA_JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms128m -Xmx384m -XX:+UseG1GC"

services:
  # Web Service Unificado (Frontend Vite + Backend Spring Boot en un solo contenedor)
  - type: web
    name: siga-veterinaria
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      # Conexión a Base de Datos Permanente (Neon.tech / PostgreSQL Perpetuo Gratuito)
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://ep-still-mouse-b4j3q5us-pooler.c-6.us-east-2.aws.neon.tech:5432/neondb?sslmode=require"
      - key: SPRING_DATASOURCE_USERNAME
        value: "neondb_owner"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "npg_lxksC5BJfD0W"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SIGA_JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms128m -Xmx384m -XX:+UseG1GC"
